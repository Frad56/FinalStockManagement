
<h2 class="title">Edit Product Variant</h2>

<div class="form-container">
  <form [formGroup]="productVariantForm" (ngSubmit)="onSubmit()" class="product-supplier-form">

    <!-- code -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Code</mat-label>
      <input matInput type="text" formControlName="code" placeholder="code">
    </mat-form-field>

    <!-- specificPrice -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Specific Price</mat-label>
      <input matInput type="number" formControlName="specificPrice" placeholder="specificPrice">
    </mat-form-field>

    <!-- quantityInStock -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>quantityInStock</mat-label>
      <input matInput type="number" formControlName="quantityInStock" placeholder="quantityInStock">
    </mat-form-field>

    <!-- Product -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Product Reference</mat-label>
      <mat-select formControlName="productId">
        <mat-option *ngFor="let product of products$ | async"
                    [value]="product.productId" >
          {{ product.reference }}
        </mat-option>
      </mat-select>
    </mat-form-field>
 

    <div class="button-group">
      <button mat-raised-button class="Create-button" color="primary" type="submit">
        Update
      </button>

      <button type="button"
              class="back-button"
              mat-raised-button
              color="primary"
              (click)="goBack()">
        Back
      </button>
    </div>

  </form>
</div>
