<h2 class="title">Create Product Variant</h2>

<div class="page-container">

  <mat-card class="form-card">

    <div *ngIf="product" class="product-badge">
      <span class="label">Product</span>
      <span class="value">{{ product.reference }}</span>
    </div>

    <form [formGroup]="productVariantForm" (ngSubmit)="onSubmit()">

      <div class="form-grid">

        <mat-form-field appearance="outline">
          <mat-label>Code</mat-label>
          <input matInput formControlName="code">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Specific Price</mat-label>
          <input matInput type="number" formControlName="specificPrice">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Stock</mat-label>
          <input matInput type="number" formControlName="quantityInStock">
        </mat-form-field>

      </div>

      <div class="table-container" formArrayName="values" *ngIf="values.length > 0">
        <h3 class="section-title">Characteristics</h3>
        <table mat-table [dataSource]="(characteristics$ | async) || []" class="custom-table">

          <ng-container matColumnDef="characteristic">
            <th mat-header-cell *matHeaderCellDef> Characteristic </th>
            <td mat-cell *matCellDef="let c">
              {{ c.characteristic.name }}
            </td>
          </ng-container>

  
          <ng-container matColumnDef="value">
            <th mat-header-cell *matHeaderCellDef> Value </th>
            <td mat-cell *matCellDef="let c; let i = index">

              <div [formGroupName]="i">
                <mat-form-field appearance="outline" class="table-input">
                  <input matInput formControlName="value" placeholder="Enter value">
                </mat-form-field>
              </div>

            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>

  
      <div class="button-group">
        <button mat-raised-button color="primary" type="submit" class="create-btn">
          Create
        </button>
        <button mat-stroked-button type="button" (click)="goBack()">
          Back
        </button>
      </div>

    </form>

  </mat-card>

</div>
