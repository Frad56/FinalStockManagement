
<h2 class="title"> edit unit  </h2>

<div class="form-container">
  <form [formGroup]="unitForm" (ngSubmit)="onSubmit()" class="product-supplier-form">

    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Unit Name</mat-label>
      <input matInput formControlName="unitName" placeholder="Enter unit name">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Unit Symbol</mat-label>
      <input matInput formControlName="unitSymbol" placeholder="Enter unit symbol">
    </mat-form-field>


    <div class="button-group">
      <button mat-raised-button class="Create-button" color="primary" type="submit">
        Update
      </button>

      <button type="button"
              class="back-button"
              mat-raised-button
              color="primary"
              (click)="goBack()">
        Back
      </button>
    </div>

  </form>
</div>
