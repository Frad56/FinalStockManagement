<h2 class="title"> Crate Movement In Stock  </h2>

<div class="form-container">
  <form [formGroup]="movementInStockForm" (ngSubmit)="onSubmit()" class="product-supplier-form">

    <mat-form-field>
        <mat-label>Movement In Stock Type</mat-label>
        <mat-select formControlName="movementInStockType">
          <mat-option *ngFor="let movementInStockType of movementInStockTypes"
          [value]="movementInStockType">    {{ movementInStockType }}</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Quantity In Stock</mat-label>
        <input matInput type="number" formControlName="quantityInStock" placeholder="quantityInStock">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Product Variant </mat-label>
        <mat-select formControlName="productVariantId">
          <mat-option *ngFor="let productVariant of productVariants$ | async"
        [value]="productVariant.productVariantId">    {{ productVariant.code }}</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-form-field>
        <mat-label>Unit</mat-label>
        <mat-select formControlName="unitId">
          <mat-option *ngFor="let unit of units$ | async"
        [value]="unit.unitId">    {{ unit.name }}</mat-option>
        </mat-select>
    </mat-form-field>

    <div class="button-group">
      <button mat-raised-button class="Create-button" color="primary" type="submit">
        Crate
      </button>

      <button type="button"
              class="back-button"
              mat-raised-button
              color="primary"
              (click)="goBack()">
        Back
      </button>
    </div>

  </form>
</div>
