<h2 class="title">Create Aisle</h2>

<div class="form-container">
  <form [formGroup]="aisleFrom" (ngSubmit)="onSubmit()" class="product-supplier-form">


    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput type="text" formControlName="name" placeholder="name">
    </mat-form-field>

  
    <div class="button-group">
      <button mat-raised-button class="Create-button" color="primary" type="submit">
        Create
      </button>

      <button type="button"
              class="back-button"
              mat-raised-button
              color="primary"
              (click)="goBack()">
        Back
      </button>
    </div>

  </form>
</div>
